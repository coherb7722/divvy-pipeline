version: 2

sources:
  - name: raw
    description: Untouched data loaded by the Python extract/load step.
    tables:
      - name: trips
        description: One row per Divvy ride, all columns as text, exactly as published.
        loaded_at_field: _loaded_at
        columns:
          - name: ride_id
            data_tests: [not_null]
      - name: weather_daily
        description: >
          Daily Chicago weather from the Open-Meteo archive API. Each month
          includes the day before it, so a date can appear twice here;
          stg_weather de-duplicates.
        columns:
          - name: date
            data_tests: [not_null]
